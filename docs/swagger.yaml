definitions:
  httpresponse.SetResponse:
    properties:
      accessTime:
        type: string
      data: {}
      status:
        type: string
    type: object
  request.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  request.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 6
        type: string
      role_id:
        type: integer
      username:
        type: string
    required:
    - email
    - first_name
    - password
    - username
    type: object
  request.RoleRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  request.UserUpdateRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        description: optional — only updated when non-empty
        type: string
      role_id:
        type: integer
      username:
        type: string
    required:
    - email
    - first_name
    - role_id
    - username
    type: object
info:
